<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F8A62"/>
      <stop offset=".55" stop-color="#0E4A36"/>
      <stop offset="1" stop-color="#062419"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".62" r=".5">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#FF6A1A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fOut" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFB13B"/>
      <stop offset=".45" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#C81E1E"/>
    </linearGradient>
    <linearGradient id="fOutSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A0A0A" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fMid" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <radialGradient id="fCore" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#FFD25A"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FBF7F"/>
      <stop offset="1" stop-color="#0F5A3E"/>
    </linearGradient>
    <linearGradient id="tree2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9E68"/>
      <stop offset="1" stop-color="#0B402C"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="front"><rect x="-200" y="268" width="912" height="400" transform="rotate(-18 256 268)"/></clipPath>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="300" r="230" fill="url(#glow)"/>
    <!-- orbit belakang -->
    <ellipse cx="256" cy="268" rx="196" ry="66" transform="rotate(-18 256 268)" fill="none" stroke="#9BE7C4" stroke-opacity=".35" stroke-width="7" stroke-dasharray="2 16" stroke-linecap="round"/>
    <!-- hutan belakang -->
    <g fill="url(#tree2)"><circle cx="-10" cy="442" r="60"/><circle cx="60" cy="420" r="52"/><circle cx="128" cy="432" r="50"/><circle cx="196" cy="414" r="46"/><circle cx="316" cy="414" r="46"/><circle cx="384" cy="432" r="50"/><circle cx="452" cy="420" r="52"/><circle cx="522" cy="442" r="60"/><rect x="-20" y="432" width="560" height="120"/></g>
    <!-- api -->
    <g filter="url(#sh)">
      <path d="M262 76 C276 136 352 170 352 268 C352 336 308 386 252 386 C196 386 156 342 156 286 C156 236 186 206 204 188 C204 222 220 244 240 246 C236 190 236 134 262 76 Z" fill="url(#fOut)"/>
      <path d="M262 76 C276 136 352 170 352 268 C352 336 308 386 252 386 C300 360 322 318 316 262 C310 202 276 160 262 76 Z" fill="url(#fOutSide)"/>
      <path d="M258 186 C268 226 312 248 312 304 C312 344 286 370 254 370 C222 370 198 346 198 314 C198 284 216 266 228 254 C230 276 240 288 252 288 C248 254 248 220 258 186 Z" fill="url(#fMid)"/>
      <path d="M254 270 C262 296 286 310 286 336 C286 356 272 368 254 368 C236 368 222 356 222 338 C222 318 238 306 244 298 C246 310 250 316 256 316 C252 300 250 286 254 270 Z" fill="url(#fCore)"/>
    </g>
    <!-- hutan depan -->
    <g fill="url(#tree)"><circle cx="10" cy="500" r="62"/><circle cx="92" cy="484" r="56"/><circle cx="170" cy="496" r="54"/><circle cx="256" cy="484" r="58"/><circle cx="342" cy="496" r="54"/><circle cx="420" cy="484" r="56"/><circle cx="502" cy="500" r="62"/><rect x="-20" y="500" width="560" height="60"/></g>
    <g fill="#7FE0AE" opacity=".35"><circle cx="72" cy="459" r="18"/><circle cx="236" cy="458" r="19"/><circle cx="400" cy="459" r="18"/></g>
    <!-- orbit depan + satelit -->
    <g clip-path="url(#front)"><ellipse cx="256" cy="268" rx="196" ry="66" transform="rotate(-18 256 268)" fill="none" stroke="#C9F5DE" stroke-opacity=".92" stroke-width="8"/></g>
    <g transform="translate(438 233) rotate(-18)">
      <rect x="-30" y="-9" width="22" height="18" rx="3" fill="#7FC8F5" stroke="#E8F7FF" stroke-width="3"/>
      <rect x="8" y="-9" width="22" height="18" rx="3" fill="#7FC8F5" stroke="#E8F7FF" stroke-width="3"/>
      <rect x="-9" y="-12" width="18" height="24" rx="5" fill="#F4F8FA"/>
      <circle cx="0" cy="0" r="4" fill="#FF6A1A"/>
    </g>
    <path d="M0 0 H512 V170 C380 210 140 210 0 170 Z" fill="url(#gloss)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="6"/>
</svg>
