name: Bangun APK & AAB Android
# Dijalankan manual (Actions → "Bangun APK & AAB Android" → Run workflow).
# Hasil: APK uji (debug) dan AAB rilis. Bila rahasia tanda tangan diisi di Settings → Secrets → Actions
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), AAB langsung ditandatangani
# dan siap diunggah ke Play Console; bila tidak, AAB belum bertanda tangan.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Susun isi aplikasi
        run: |
          cd aplikasi-android
          npm ci --no-audit --no-fund
          node siapkan-www.mjs
          npx cap sync android
      - name: Kunci tanda tangan (bila ada)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > aplikasi-android/android/rilis.jks
            printf 'storeFile=../rilis.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KSP" "$KA" "$KP" > aplikasi-android/android/keystore.properties
          fi
      - name: Bangun
        run: |
          cd aplikasi-android/android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          mkdir -p ../../keluaran
          cp app/build/outputs/apk/debug/app-debug.apk ../../keluaran/PantauRimbak-uji.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../keluaran/PantauRimbak-rilis.aab
          rm -f rilis.jks keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: pantau-rimbak-android
          path: keluaran/
