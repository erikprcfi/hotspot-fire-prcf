name: Pemantauan sistem

# Memeriksa situs, kesegaran data, server database pengguna dan APK tiap 6 jam.
# Bila ada masalah: membuka/memperbarui issue "Pemantauan sistem" (pemilik repositori menerima email dari GitHub).
# Bila sudah normal kembali: issue ditutup otomatis.
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pantau-sistem
  cancel-in-progress: true

jobs:
  pantau:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Periksa sistem
        id: cek
        continue-on-error: true
        run: python scripts/pantau.py
      - name: Laporkan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAGAL: ${{ steps.cek.outcome == 'failure' }}
        run: |
          R="$GITHUB_REPOSITORY"; JUDUL="Pemantauan sistem: ada bagian Fire Hotspot yang bermasalah"
          NO=$(gh api "repos/$R/issues?state=open&per_page=100" -q '[.[] | select(.title | startswith("Pemantauan sistem"))][0].number // empty')
          cat laporan_pantau.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$GAGAL" = "true" ]; then
            if [ -n "$NO" ]; then gh api "repos/$R/issues/$NO/comments" -F body=@laporan_pantau.md > /dev/null
            else gh api "repos/$R/issues" -f title="$JUDUL" -F body=@laporan_pantau.md > /dev/null; fi
            exit 1
          elif [ -n "$NO" ]; then
            gh api "repos/$R/issues/$NO/comments" -F body=@laporan_pantau.md > /dev/null
            gh api "repos/$R/issues/$NO/comments" -f body="Semua pemeriksaan kembali normal ✅" > /dev/null
            gh api -X PATCH "repos/$R/issues/$NO" -f state=closed > /dev/null
          fi
