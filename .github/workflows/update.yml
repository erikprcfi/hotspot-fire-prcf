name: Perbarui titik panas FIRMS

on:
  schedule:
    - cron: "17 */3 * * *"   # setiap 3 jam (UTC)
    - cron: "47 1-23/3 * * *"   # jadwal tambahan: GitHub sering menunda/melewatkan jadwal, data tertinggal 5–9 jam
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pantau-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang pustaka
        run: pip install shapely==2.0.6 pyproj==3.7.0 pyshp==2.3.1 rasterio==1.4.3 scipy==1.14.1 pillow==11.0.0
      - name: Elemen orbit satelit (TLE CelesTrak) untuk lintasan berikutnya
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/tle.py
      - name: Angin 10 m seluruh Indonesia (ECMWF IFS open data) untuk animasi peta
        continue-on-error: true
        timeout-minutes: 10
        run: pip install -q ecmwf-opendata eccodes eccodeslib && python scripts/angin_nasional.py
      - name: Unduh & olah data NASA FIRMS
        env:
          ANALISIS_KEY: ${{ secrets.ANALISIS_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AKUN_URL: https://script.google.com/macros/s/AKfycbxlGnyedmPby29Fu_UFnJR_sW2GPQ-RuaV7LWcqfAU3X0VOrVvN4xahwLWH6nsTYiph/exec
        run: python scripts/pipeline.py
      - name: Peringatan dini otomatis (notifikasi HP & email)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANALISIS_KEY: ${{ secrets.ANALISIS_KEY }}
          AKUN_URL: https://script.google.com/macros/s/AKfycbxlGnyedmPby29Fu_UFnJR_sW2GPQ-RuaV7LWcqfAU3X0VOrVvN4xahwLWH6nsTYiph/exec
        run: pip install -q cryptography && python scripts/peringatan.py
      - name: Bekas terbakar dari Sentinel-2 (bertahap, maks. 20 menit per run)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/bekas_terbakar.py --menit 20
      - name: Peringatan perubahan hutan dari Sentinel-2 (sebulan sekali per lokasi)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/peringatan_hutan.py
      - name: Ringkasan titik panas per provinsi & kabupaten (Indonesia hari ini)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ringkas_nasional.py
      - name: Simpan perubahan data
        run: |
          git config user.name "pantau-api-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Data FIRMS $(date -u +%Y-%m-%dT%H:%MZ)"
          # bila ada perubahan lain di GitHub saat run berjalan: gabungkan (data bot diutamakan) lalu coba lagi
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --no-rebase --no-edit -X ours origin main || true
            sleep $((i*5))
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy0
        continue-on-error: true   # situs ±490 MB: GitHub Pages kadang perlu > 10 menit (batas maksimum deploy-pages) → coba sekali lagi
        uses: actions/deploy-pages@v4
      - id: deploy
        if: steps.deploy0.outcome == 'failure'
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy0.outputs.page_url }}
