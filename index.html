<script>
/* Website memakai tampilan & alat yang sama dengan aplikasi (app.html, mode website).
   Tautan lama tetap berfungsi: #peta, #prakiraan, #buat-laporan, #status-sistem, #analisis, #unduh, #riwayat. */
(function () {
  var h = location.hash.replace('#', ''), q = new URLSearchParams(location.search), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var view = { peta: 'home', prakiraan: 'fc', 'buat-laporan': 'lap', 'status-sistem': 'info' }[h], alat = { analisis: 'analisis', unduh: 'unduh', riwayat: 'grafik', sumber: 'sistem' }[h];
  var p = [];
  if (!standalone || q.get('web') === '1') p.push('web=1');
  if (q.get('lokasi')) p.push('lokasi=' + encodeURIComponent(q.get('lokasi')));
  if (alat) p.push('alat=' + alat);
  location.replace('app.html' + (p.length ? '?' + p.join('&') : '') + (view ? '#' + view : ''));
})();
</script>

</head>
